services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentmem
      POSTGRES_USER: agentmem
      POSTGRES_PASSWORD: ${AGENT_MEM_PG_PASSWORD:-agentmem}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Docker's default 64 MB of /dev/shm is not enough for a parallel HNSW index
    # build over public.observations: it fails with "could not resize shared
    # memory segment ... No space left on device". During a restore pg_restore
    # treats that as an ignored error and continues, so the vector index ends up
    # absent — not invalid, absent — from a restore that otherwise looks clean.
    shm_size: 1gb
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentmem"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    # Credentials and env-only settings come from a gitignored .env next to
    # this file (see .env.example). Optional form: an absent .env must not
    # break local development. Values under `environment:` below still win —
    # DATABASE_URL must always reach postgres by service name.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://agentmem:${AGENT_MEM_PG_PASSWORD:-agentmem}@postgres:5432/agentmem
    ports:
      - "34567:34567"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

volumes:
  pgdata:
