# Replay manifest for the six graph-context probes run during the 2026-10-11 audit
# (docs/ai/2026-10-11-graph-context-quality.md). Read-only replays against the hub:
#   base_url: http://localhost:34567   (AGENT_MEM_GRAPH_URL in p-agent/.env)
#   auth:     Authorization: Bearer $AGENT_MEM_API_KEY   (never written here)
# Every probe was run twice through POST /api/graph/resolve (asker_eeid 0, then the
# real eeid) and once through GET /api/graph/search. The eeid came from
# GET /api/graph/person?q=<slack uid> at audit time (people[0].eeid).
# Seeds are passed verbatim; the server canonicalises Slack permalinks to thread roots.
# No customer PII: Slack user ids, node ids and permalinks only.

audit_date: 2026-10-11
base_url: http://localhost:34567
hybrid_types: &hybrid_types slack,slack_thread,gh_pr,jira,cf,cf_page,gws,gws_doc,gdoc,wegohub,claude_artifact,pagerduty,sentry,datadog
resolve_defaults: &resolve_defaults
  depth: 2
  budget_tokens: null        # field omitted; server default 4000 applied (context_tokens reported 3955-4000)
  include_bodies: false

probes:
  - id: probe-a
    use_case: UC2
    label: Jira question - trace PAY-1731 translated availability message
    source_thread: https://wego.slack.com/archives/CUV9EAYGY/p1791450444383399
    asker_slack_uid: U050BBA607M
    asker_eeid: 651
    resolve_request:
      <<: *resolve_defaults
      seeds:
        - https://wego.slack.com/archives/CUV9EAYGY/p1791450444383399
        - jira:PAY-1731
      query: "Help me to trace PAY-1731 whether the code today returns translated communication message in the code today. For payment method availability."
      asker_eeid: [0, 651]   # run once per value
    hybrid_request:
      q: "Help me to trace PAY-1731 whether the code today returns translated communication message in the code today. For payment method availability."
      match: hybrid
      limit: 10
      types: *hybrid_types
      X-Asker-User: null     # header not sent
    observed:
      resolve_asker0: {artifacts: 16, expanded_nodes: 101, after_acl: 101, context_tokens: 4000}
      resolve_real: {artifacts: 6, expanded_nodes: 101, after_acl: 32, context_tokens: 3957}
      dropped_for_real_asker: [jira:PAY-1731, gh_pr:wego/wego-docs#682, jira:PAY-1079, "7 jira_attachment nodes"]
      distinct_relevant_real: 4
      duplicate_reply_nodes_real: 2
      hybrid_results: 10
      hybrid_top3: [jira:PAY-1731, slack:CUV9EAYGY:1791450444.383399, slack:CUV9EAYGY:1791450445.967909]
      hybrid_relevant_at_10: 9
    variants:
      - note: include_bodies=true, asker_eeid 651 -> 6 artifacts, summary empty on all, seed body_len 14540 (16 replies, 12 EnzoBot references)
      - note: hybrid with X-Asker-User U050BBA607M and no types param -> 10 results, slack only (13 without header); X-Asker-User 651 -> 0 results

