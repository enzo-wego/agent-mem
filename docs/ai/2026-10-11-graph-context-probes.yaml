      resolve_real: {artifacts: 1, expanded_nodes: 3, after_acl: 3, context_tokens: 1011}
      distinct_relevant_real: 0   # seed only, recall 0
      hybrid_results: 10
      hybrid_top3: [slack:CUV9EAYGY:1790675479.191359, slack:CUV9EAYGY:1767578784.158839, jira:PAY-473]
      hybrid_relevant_at_10: 4

