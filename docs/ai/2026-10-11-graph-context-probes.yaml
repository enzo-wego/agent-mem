      asker_eeid: [0, 708]
    hybrid_request:
      q: "For Tabby UAE, Pay in 3 and Pay in 4 - check what parameter in the payment request differentiates the two tenures? Are we sending a parameter that denotes tenure or are the processed via different merchant IDs?"
